services:
  - type: web
    name: our-little-world
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "python manage.py migrate --noinput && python manage.py collectstatic --no-input && python manage.py seed_love_data && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
